name: Build Linux Kernel (optional release)

# Trigger manually from GitHub Actions -> Run workflow.
# Builds are test artifacts by default. Publishing a public release requires
# the explicit opt-in below.
on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish this build as an immutable GitHub Release'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build-kernel:
    name: Build Linux 5.15.135 (.deb)
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    outputs:
      kernel_release: ${{ steps.version.outputs.kernel_release }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install kernel build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison flex libssl-dev libelf-dev \
            dwarves fakeroot rsync kmod cpio dpkg-dev debhelper

      - name: Configure kernel
        working-directory: linux-5.15.135
        shell: bash
        run: |
          set -euo pipefail
          cp ../config/kernel.config .config

          # The only version suffix source is this directory's Makefile:
          #   EXTRAVERSION = -t35-v1
          # Do not set a second suffix via the .config or CI.
          scripts/config --set-str LOCALVERSION ""
          scripts/config --disable LOCALVERSION_AUTO

          # The Ubuntu .config includes Canonical-specific certificate paths
          # absent from upstream Linux source.
          scripts/config --set-str SYSTEM_TRUSTED_KEYS ""
          scripts/config --set-str SYSTEM_REVOCATION_KEYS ""

          # Avoid producing multi-GB debug data on a limited-disk runner.
          scripts/config --disable DEBUG_INFO
          scripts/config --disable DEBUG_INFO_BTF
          scripts/config --disable DEBUG_INFO_BTF_MODULES
          scripts/config --disable GDB_SCRIPTS

          make olddefconfig

      - name: Read and validate kernel release from Makefile
        id: version
        working-directory: linux-5.15.135
        shell: bash
        run: |
          set -euo pipefail
          release="$(make -s LOCALVERSION= kernelrelease)"
          printf 'Kernel release: %s\n' "$release"

          # Keep release, package name and uname -r in agreement.
          if [[ ! "$release" =~ ^5\.15\.135-t35-v[0-9]+$ ]]; then
            echo "::error::Update linux-5.15.135/Makefile: EXTRAVERSION = -t35-v1 (or -t35-v2, etc.). Actual kernelrelease: $release"
            exit 1
          fi

          echo "kernel_release=$release" >> "$GITHUB_OUTPUT"
          echo "KERNEL_RELEASE=$release" >> "$GITHUB_ENV"

      - name: Build .deb packages
        working-directory: linux-5.15.135
        shell: bash
        run: |
          set -euo pipefail
          # Setting LOCALVERSION (even to empty) prevents a Git '+' suffix.
          export LOCALVERSION=""
          make -j2 LOCALVERSION= bindeb-pkg
          df -h /

      - name: Collect and verify packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          find . -maxdepth 1 -type f -name '*.deb' -print -exec cp -- '{}' out/ \;
          if ! compgen -G 'out/linux-image-*.deb' > /dev/null; then
            echo '::error::No linux-image .deb found.'
            exit 1
          fi
          cp linux-5.15.135/.config out/kernel.config
          printf '%s\n' "$KERNEL_RELEASE" > out/KERNEL_RELEASE
          (cd out && sha256sum *.deb kernel.config KERNEL_RELEASE > SHA256SUMS)
          ls -lh out/

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ steps.version.outputs.kernel_release }}-deb
          path: out/*
          if-no-files-found: error
          # Test builds are retrieved from the Actions run, not Releases.
          retention-days: 14

  publish-release:
    name: Publish immutable GitHub Release
    needs: build-kernel
    # A normal Run workflow invocation ends after the artifact upload.
    if: ${{ inputs.publish_release }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Download release files
        uses: actions/download-artifact@v4
        with:
          name: linux-${{ needs.build-kernel.outputs.kernel_release }}-deb
          path: out

      - name: Publish new GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          KERNEL_RELEASE: ${{ needs.build-kernel.outputs.kernel_release }}
        run: |
          set -euo pipefail
          notes="Linux $KERNEL_RELEASE; built from commit $GITHUB_SHA. Install only in the course test VM."
          if gh release view "$KERNEL_RELEASE" >/dev/null 2>&1; then
            echo "::error::Release $KERNEL_RELEASE already exists and is immutable. Bump EXTRAVERSION before publishing."
            exit 1
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$KERNEL_RELEASE" >/dev/null 2>&1; then
            echo "::error::Tag $KERNEL_RELEASE already exists. Bump EXTRAVERSION before publishing."
            exit 1
          fi

          # gh creates the version tag at the exact commit built by this run.
          # Never force-push a tag or replace assets in an existing release.
          gh release create "$KERNEL_RELEASE" \
            out/*.deb out/kernel.config out/KERNEL_RELEASE out/SHA256SUMS \
            --target "$GITHUB_SHA" --title "$KERNEL_RELEASE" --notes "$notes"
